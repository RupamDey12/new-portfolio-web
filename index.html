<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obsidian Protocol Portfolio</title>
    <meta name="description" content="Developer-core engineering portfolio featuring WebGL matrix shaders, real-time algorithm visualizer, project console, and Obsidian Protocol styling for Rupam Dey." />
    <meta property="og:title" content="Obsidian Protocol Portfolio" />
    <meta property="og:description" content="Developer-core engineering portfolio featuring WebGL matrix shaders, real-time algorithm visualizer, project console, and Obsidian Protocol styling for Rupam Dey." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        background-color: #0D0D0D !important;
        color: #e3e2e2;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
      }
      #root-fallback {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0D0D0D;
        font-family: 'JetBrains Mono', monospace, monospace;
        color: #00FF41;
        font-size: 13px;
        letter-spacing: 0.05em;
      }
      .fallback-bar {
        width: 140px;
        height: 3px;
        background: #1A1C1C;
        margin-top: 10px;
        overflow: hidden;
        border-radius: 2px;
      }
      .fallback-progress {
        width: 40%;
        height: 100%;
        background: #00FF41;
        animation: fallback-pulse 1.2s infinite ease-in-out alternate;
      }
      @keyframes fallback-pulse {
        0% { transform: translateX(-50%); }
        100% { transform: translateX(200%); }
      }
    </style>
  </head>
  <body class="bg-[#0D0D0D] text-[#e3e2e2] antialiased selection:bg-[#00FF41]/30 selection:text-[#00FF41]" style="background-color: #0D0D0D; color: #e3e2e2; margin: 0;">
    <div id="root">
      <div id="root-fallback">
        <div>&gt; OBSIDIAN_PROTOCOL // INITIALIZING SYSTEM...</div>
        <div class="fallback-bar">
          <div class="fallback-progress"></div>
        </div>
      </div>
    </div>
    <script>
      // GitHub Pages Auto-Recovery:
      // If GitHub Pages is serving the raw repository root (where /src/main.tsx is uncompiled),
      // instantly forward to the compiled production build in /docs/
      (function() {
        try {
          var isGitHub = window.location.hostname.indexOf('github.io') !== -1;
          var hasUncompiledScript = !!document.querySelector('script[src*="/src/main.tsx"]');
          var inDocs = window.location.pathname.indexOf('/docs') !== -1;
          if (isGitHub && hasUncompiledScript && !inDocs) {
            var base = window.location.pathname.replace(/\/+$/, '');
            var targetUrl = window.location.origin + base + '/docs/' + window.location.search + window.location.hash;
            window.location.replace(targetUrl);
          }
        } catch (e) {
          console.warn('Navigation recovery error:', e);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
